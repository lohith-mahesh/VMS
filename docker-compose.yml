services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local environment}
    ports:
      - "1433:1433"
    volumes:
      - rrvms-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: src/RRVMS.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Rrvms: "Server=sql,1433;Database=Rrvms;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local environment};Encrypt=false;TrustServerCertificate=true"
      DocumentStorage__Provider: File
      DocumentStorage__LocalPath: /app/data/documents
    ports:
      - "5208:8080"
    volumes:
      - rrvms-documents:/app/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    entrypoint: ["/bin/bash", "-c"]
    command: ["/opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"IF DB_ID(N'Rrvms') IS NULL CREATE DATABASE Rrvms\" && /opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -d Rrvms -i /migrations/001_initial.sql"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your local environment}
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      sql:
        condition: service_healthy
  web:
    build:
      context: apps/web
      args:
        VITE_AUTH_MODE: development
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  rrvms-sql:
  rrvms-documents:
