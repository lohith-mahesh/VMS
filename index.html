late-columns:minmax(180px,1fr) minmax(220px,2fr);gap:14px;align-items:end;border:1px solid #cfd5df;border-radius:8px;background:#fff;padding:16px;margin-bottom:14px}.badge-type{display:inline-block;border-radius:999px;padding:7px 11px;color:#fff;font-size:12px;font-weight:750}.badge-orange{background:#a64b00}.badge-red{background:#c62828}.completion-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.completion-check{display:flex;align-items:center;gap:10px;border:1px solid var(--primary);border-radius:8px;background:#fff;padding:14px;font-weight:700}.completion-check input{width:19px;height:19px}

on-person small{display:block;color:var(--muted);margin-top:4px}.reception-person.active{border-color:var(--primary);box-shadow:0 0 0 2px rgba(16,6,159,.12);background:#f7f6ff}.reception-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}.modal{max-height:min(720px,calc(100vh - 32px));overflow-y:auto;border-radius:12px}.toast{border-radius:8px}.mobile-reception{display:none}

@media(max-width:760px){.sidebar{display:none}.mobile-menu{display:block;position:fixed;left:16px;top:16px;z-index:60}.mobile-menu summary{list-style:none;border:1px solid #28436c;border-radius:7px;background:var(--primary);color:#fff;padding:10px 12px;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(20,32,48,.12)}.mobile-menu summary::-webkit-details-marker{display:none}.mobile-nav-panel{width:min(272px,calc(100vw - 32px));margin-top:6px;border-radius:8px;background:var(--primary);padding:10px 0;box-shadow:0 8px 20px rgba(20,32,48,.2)}.topbar{height:68px;padding:0 16px 0 76px}.top-actions{margin-left:auto}.top-actions .small{display:none}.search{display:none}.content{padding:24px 16px 44px}.page-header{align-items:flex-start;flex-direction:column}.page-header h1{font-size:30px}.form-section{grid-template-columns:1fr;padding:18px}.date-row,.asset-row{grid-template-columns:1fr}.split{grid-template-columns:1fr}.classification-grid,.selection-grid,.reception-queue,.reception-controls,.verification-grid,.badge-panel,.completion-checks{grid-template-columns:1fr}.desktop-only,.reception-desktop{display:none}.mobile-records,.mobile-reception{display:block}.mobile-record,.mobile-reception-card{border:1px solid var(--silver);border-radius:9px;background:#fff;padding:16px;margin-bottom:12px}.mobile-record dl,.mobile-reception-card dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mobile-record dt,.mobile-reception-card dt{font-size:10px;color:var(--muted);text-transform:none}.mobile-record dd,.mobile-reception-card dd{margin:3px 0 0;font-size:13px;overflow-wrap:anywhere}.schedule-heading{flex-direction:column}.schedule-grid{grid-template-columns:1fr}.phone-fields{grid-template-columns:1fr}.checkbox-grid{grid-template-columns:1fr}.form-record{align-items:flex-start;flex-direction:column}.form-record>span:last-child{display:flex;flex-wrap:wrap;gap:8px}.modal{padding:20px}.selection-card{grid-template-columns:auto minmax(0,1fr) auto}.selection-card <body>
<div id="app" class="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite" aria-atomic="true"></div>
<script>
const USERS = __USERS__
const STATUS_LABELS={DRAFT:'Draft',VISITOR_FORM_PENDING:'Visitor details pending',VISITOR_FORM_SUBMITTED:'Visitor details saved',REVISION_REQUIRED:'Revision required',HOST_REVIEW:'Host review',PENDING_EC_REVIEW:'Pending Export Control review',EC_REVIEW:'Export Control review',PENDING_DOCUMENTATION:'Pending information',DOCUMENTATION_SUBMITTED:'Information submitted',EC_RE_REVIEW_REQUIRED:'Export Control re-review required',APPROVED:'Approved',PARTIALLY_APPROVED:'Partially approved',REJECTED:'Rejected',CANCELLED:'Cancelled',VERIFICATION_IN_PROGRESS:'Verification in progress',RECEPTION_VERIFICATION:'Ready for check-in',RECEPTION_HOLD:'Reception hold',CHECKED_IN:'Checked in',COMPLETED:'Checked out',NO_SHOW:'No-show',ENTRY_REJECTED:'Entry rejected',VISIT_PROCESS_COMPLETED:'Visit completed',UPCOMING:'Expected',SUBMITTED:'Saved',PENDING:'Pending',HOLD:'Hold',RESOLVED:'Resolved',NotVerified:'Not verified',Verified:'Verified',Undeclared:'Undeclared'}
const COUNTRIES=__COUNTRIES__
const REQUEST_FIELD_LABELS={fullName:'Full legal name',designation:'Designation/position held',citizenship:'Citizenship',companyName:'Visitor company',companyAddress:'Company address',officeCity:'Company city',officeCountry:'Company country',phoneCountry:'Phone country code',telephone:'Phone number',email:'Email address',idType:'ID type',otherIdType:'Government-issued ID type',assets:'Declared assets'}
const app=document.getElementById('app')
const modalRoot=document.getElementById('modal-root')
const toastRoot=document.getElementById('toast-root')
let user=USERS.find(item=>item.id===localStorage.getItem('visitor.session'))||null
let viewToken=0
let visitorDraft=null
let modalReturnFocus=null

const h=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))
const label=value=>STATUS_LABELS[value]||String(value||'').replaceAll('_',' ').toLowerCase().replace(/\b\w/g,char=>char.toUpperCase())
const fmtDate=value=>value?new Date(value.length===10?value+'T00:00:00':value).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'Not scheduled'
const fmtTime=value=>value?new Date(value).toLocaleString():'Pending'
const fmtIst=value=>value?new Date(value).toLocaleString(undefined,{timeZone:'Asia/Kolkata',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})+' IST':'Not scheduled'
const chip=value=>'<span class="status-chip">'+h(label(value))+'</span>'
const pageHeader=(eyebrow,title,subtitle='',actions='')=>'<header class="page-header"><div><p class="eyebrow">'+h(eyebrow)+'</p><h1 class="display">'+h(title)+'</h1>'+(subtitle?'<p class="muted small">'+h(subtitle)+'</p>':'')+'</div>'+actions+'</header>'
const errorBox=message=>'<div class="error-box" role="status"><span>'+h(message)+'</span><button class="text-button" data-render>Retry</button></div>'
const requiredMark=required=>required?'<span class="required-mark" aria-hidden="true"> *</span>':''
const field=(name,title,value='',type='text',required=false,extraClass='')=>'<label class="field '+h(extraClass)+'">'+h(title)+requiredMark(required)+'<input name="'+h(name)+'" type="'+h(type)+'" value="'+h(value)+'" '+(required?'required aria-required="true"':'')+'></label>'
const textareaField=(name,title,value='',required=false,extraClass='')=>'<label class="field '+h(extraClass)+'">'+h(title)+requiredMark(required)+'<textarea name="'+h(name)+'" rows="4" '+(required?'required aria-required="true"':'')+'>'+h(value)+'</textarea></label>'
const selectField=(name,title,value,options,required=false,extraClass='')=>'<label class="field '+h(extraClass)+'">'+h(title)+requiredMark(required)+'<select name="'+h(name)+'" '+(required?'required aria-required="true"':'')+'>'+options.map(option=>'<option value="'+h(option.value??option)+'" '+((option.value??option)===value?'selected':'')+'>'+h(option.label??option)+'</option>').join('')+'</select></label>'
const infoField=(title,value,strong=false)=>'<p><strong>'+h(title)+':</strong> <span '+(strong?'class="link"':'')+'>'+h(value||'N/A')+'</span></p>'
const recordList=(items,render,empty)=>items&&items.length?items.map(render).join(''):'<p class="muted small">'+h(empty)+'</p>'

async function api(path,options={}){
  const headers={...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}
  if(user)headers['X-Visitor-Role']=user.id
  const response=await fetch(path,{...options,headers})
  if(response.status===401&&user){user=null;localStorage.removeItem('visitor.session');go('/login');throw new Error('Your session ended. Please sign in again.')}
  const contentType=response.headers.get('content-type')||''
  const data=contentType.includes('application/json')?await response.json():await response.text()
  if(!response.ok)throw new Error(data.error||data||'The request could not be completed.')
  return data
}

function go(path){history.pushState({},'',path);render().then(()=>document.getElementById('main-content')?.focus())}
function toast(message,type=''){toastRoot.innerHTML='<div class="toast '+h(type)+'">'+h(message)+'</div>';setTimeout(()=>{toastRoot.innerHTML=''},3200)}
function closeModal(){modalRoot.innerHTML='';modalRoot.onkeydown=null;if(modalReturnFocus?.isConnected)modalReturnFocus.focus();modalReturnFocus=null}
function modal(title,body,submitLabel,onSubmit,tone='primary'){
  modalReturnFocus=document.activeElement
  modalRoot.innerHTML='<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">'+h(title)+'</h2><div style="margin-top:18px">'+body+'</div><div class="modal-actions"><button class="secondary-button" id="modal-cancel">Cancel</button><button class="'+tone+'-button" id="modal-submit">'+h(submitLabel)+'</button></div></section></div>'
  document.getElementById('modal-cancel').onclick=closeModal
  modalRoot.querySelector('.modal-backdrop').onclick=event=>{if(event.target===event.currentTarget)closeModal()}
  document.getElementById('modal-submit').onclick=async event=>{const button=event.currentTarget;button.disabled=true;try{await onSubmit();closeModal()}catch(reason){button.disabled=false;toast(reason.message,'error')}}

function requestVisitorGroup(item){
  const names=Array.isArray(item.visitorNames)?item.visitorNames:[],companies=Array.isArray(item.companyNames)?item.companyNames:[]
  const count=Number(item.visitorCount)||names.length||1
  if(count===1){
    const name=names[0]||item.visitorName||'Visitor details pending'
    const company=companies[0]||item.companyName||'Company details pending'
    return'<div><strong>'+h(name)+'</strong><p class="tiny muted">'+h(company)+'</p></div>'
  }
  const completed=Math.max(0,Math.min(count,Number(item.completedVisitorForms)||0))
  const companyText=companies.length?companies.length+' '+(companies.length===1?'company':'companies'):'Company details pending'
  return'<div><strong>'+h(count)+'</strong><p class="tiny muted">'+h('No. of visitors · '+completed+' of '+count+' forms saved · '+companyText)+'</p></div>'
}

function receptionWorkflow(request,activeVisitor,activeDay,approvedVisitorOptions,dayOptions){
  const queue=request.visitors.filter(visitor=>visitor.ecDecision==='APPROVED').flatMap(visitor=>visitor.receptionRecords.map(record=>{const day=request.visitDays.find(item=>item.id===record.visitDayId);const selected=activeVisitor===visitor.id&&activeDay===record.visitDayId;const href='/visitor-requests/'+h(request.id)+'?visitor='+encodeURIComponent(visitor.id)+'&day='+encodeURIComponent(record.visitDayId);return'<a href="'+href+'" data-route class="reception-person '+(selected?'active':'')+'" aria-current="'+(selected?'true':'false')+'"><span><strong>'+h(visitor.fullName)+'</strong><small>'+h(fmtDate(day?.visitDate||''))+'</small></span>'+chip(record.status)+'</a>'})).join('')

  const assets='<section class="verification-step"><div class="panel-heading"><h3>2. Verify assets</h3>'+chip(record.assetsStatus)+'</div>'+(record.assetsHoldReason?'<p class="small" style="margin-top:12px">'+h(record.assetsHoldReason)+'</p>':'')+(!locked?'<div class="button-row"><button class="success-button" data-detail-action="assets-approve">Approve</button><button class="warning-button" data-detail-action="assets-hold">Hold</button></div>':'')+'</section>'
  const ready=record.identityStatus==='APPROVED'&&record.assetsStatus==='APPROVED'&&record.status==='RECEPTION_VERIFICATION'
  const checkedIn=['CHECKED_IN','COMPLETED'].includes(record.status),checkedOut=record.status==='COMPLETED'
  const badge='<div class="badge-panel"><div><p class="tiny muted" style="margin-bottom:7px">Badge type</p>'+badgeTypeTag(record.badgeType||visitor.badgeType)+'</div><label class="field">Badge ID'+requiredMark(true)+'<input name="receptionBadge" value="'+h(record.badge||'')+'" maxlength="64" '+(checkedIn?'disabled':'')+'></label></div>'
  const completion='<div class="completion-checks"><label class="completion-check"><input type="checkbox" data-reception-toggle="check-in" '+(checkedIn?'checked disabled':ready?'':'disabled')+'> Checked in</label><label class="completion-check"><input type="checkbox" data-reception-toggle="check-out" '+(checkedOut?'checked disabled':record.status==='CHECKED_IN'?'':'disabled')+'> Checked out</label></div>'
  const noShow=['UPCOMING','VERIFICATION_IN_PROGRESS','RECEPTION_VERIFICATION'].includes(record.status)?'<button class="secondary-button" data-detail-action="no-show">Mark as no-show</button>':''
  return'<section class="reception-actions"><div class="reception-queue" aria-label="Approved visitors">'+queue+'</div>'+controls+'<div class="verification-grid">'+identity+assets+'</div>'+badge+completion+(noShow?'<div class="button-row" style="margin-top:14px">'+noShow+'</div>':'')+'</section>'
}

  const contractorFields=request.visitorType==='External'?infoField('Facilities contractor',request.faculty?'Yes':'No')+infoField('Gas Turbine Research Establishment contractor',request.gtr?'Yes':'No'):''
  const requestFields=infoField('Batch ID',request.batchId,true)+infoField('Request number',request.requestNumber)+infoField('Number of visitors',request.visitorCount)+infoField('Site/facility',request.visitingSite)+infoField('Visit start',fmtIst(request.visitStart))+infoField('Visit end',fmtIst(request.visitEnd))+infoField('Purpose of visit',request.visitPurposeType)+infoField('Purpose details',request.purpose)+infoField('Areas to visit',request.areasToVisit)+infoField('Main host',request.mainHostName)+infoField('Escorting host',request.escortingHostName)+contractorFields+(request.cancellationReason?infoField('Cancellation reason',request.cancellationReason):'')
  const visitorDetails=request.visitors.map((visitor,index)=>visitorCard(visitor,index,request.visitDays)).join('')

  const informationHistory=recordList(request.informationRequests,item=>{const changes=recordList(item.changes,change=>'<p class="tiny"><strong>'+h(change.field)+':</strong> '+h(typeof change.before==='object'?JSON.stringify(change.before):change.before||'Empty')+' → '+h(typeof change.after==='object'?JSON.stringify(change.after):change.after||'Empty')+'</p>','');return'<div class="record"><div style="display:flex;justify-content:space-between;gap:12px"><strong>'+h(item.visitorName)+'</strong>'+chip(item.status)+'</div><p class="tiny">'+h(item.fieldLabels.join(', '))+'</p><p class="tiny muted">'+h(item.comment)+'</p>'+changes+'</div>'},'No information requests.')

  const requestHeading=request.visitorCount===1?request.visitors[0].fullName:request.visitorCount+' visitors'
  main.innerHTML='<a href="/visitor-requests" data-route class="back-link link">← Back to requests</a>'+pageHeader('Request details',requestHeading,request.requestNumber+' · '+request.batchId,chip(request.currentStatus))+actions+forms+'<div class="info-grid">'+detailInfo('Request information',requestFields)+visitorDetails+'</div><div class="detail-stack" style="margin-top:24px">'+screening+histories+'</div>'
  bindDetailActions(request)

  document.querySelector('[data-select-all-ec]')?.addEventListener('click',()=>document.querySelectorAll('[name="ecVisitor"]').forEach(item=>{item.checked=true}))

  if(receptionVisitor)receptionVisitor.onchange=updateReceptionSelection
  if(receptionDay)receptionDay.onchange=updateReceptionSelection

function chosenClassification(){return document.querySelector('[name="classification"]:checked')?.value||''}
function chosenEcVisitors(){return[...document.querySelectorAll('[name="ecVisitor"]:checked')].map(item=>item.value)}
function chosenVisitor(){return document.querySelector('[name="activeVisitor"]')?.value||''}
function chosenDay(){return document.querySelector('[name="activeDay"]')?.value||''}
function istParts(value){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(value)).filter(item=>item.type!=='literal').map(item=>[item.type,item.value]));return{date:parts.year+'-'+parts.month+'-'+parts.day,time:parts.hour+':'+parts.minute}}
async function actionRequest(request,action,extra={}){await api('/api/visitor-requests/'+encodeURIComponent(request.id)+'/actions',{method:'POST',body:JSON.stringify({action,visitorFormId:chosenVisitor(),visitDayId:chosenDay(),...extra})});toast('Request updated.');await render()}
function requireClassification(){const value=chosenClassification();if(!value)throw new Error('Select Vendor or Visitor.');return value}
function requireEcVisitors(){const values=chosenEcVisitors();if(!values.length)throw new Error('Select at least one visitor.');return values}
function requireReceptionSelection(){const visitorFormId=chosenVisitor(),visitDayId=chosenDay();if(!visitorFormId||!visitDayId)throw new Error('Select a visitor and visit date.');return{visitorFormId,visitDayId}}
function bindDetailActions(request){
  document.querySelectorAll('[data-detail-action]').forEach(button=>button.onclick=async()=>{
    const action=button.dataset.detailAction
    try{
      if(action==='host-review'){modal('Save host review','<p class="small">Confirm that every visitor form has been reviewed.</p>','Save',()=>actionRequest(request,'host-review'));return}
      if(action==='send-to-ec'){modal('Send to Export Control','<p class="small">The request will be locked for Export Control review.</p>','Send',()=>actionRequest(request,'send-to-ec'));return}
      if(action==='reschedule'){
        const start=istParts(request.visitStart),end=istParts(request.visitEnd),now=istNowParts()
        modal('Reschedule visit','<div class="schedule-grid">'+field('newStartDate','Start date',start.date,'date',true)+field('newStartTime','Start time',start.time,'time',true)+field('newEndDate','End date',end.date,'date',true)+field('newEndTime','End time',end.time,'time',true)+'</div>'+textareaField('rescheduleReason','Reason') ,'Reschedule',()=>{const values={startDate:document.querySelector('[name="newStartDate"]').value,startTime:document.querySelector('[name="newStartTime"]').value,endDate:document.querySelector('[name="newEndDate"]').value,endTime:document.querySelector('[name="newEndTime"]').value,reason:document.querySelector('[name="rescheduleReason"]').value};return actionRequest(request,'reschedule',values)})
        const startDate=document.querySelector('[name="newStartDate"]'),startTime=document.querySelector('[name="newStartTime"]'),endDate=document.querySelector('[name="newEndDate"]'),endTime=document.querySelector('[name="newEndTime"]')
        const updateLimits=()=>{startDate.min=now.date;endDate.min=startDate.value||now.date;startTime.min=startDate.value===now.date?now.time:'';if(endDate.value<startDate.value)endDate.value=startDate.value;endTime.min=endDate.value===startDate.value?startTime.value:''}
        ;[startDate,startTime,endDate,endTime].forEach(input=>input.addEventListener('change',updateLimits));updateLimits()
        return
      }
      if(action==='cancel'){modal('Cancel request',textareaField('cancelReason','Cancellation reason','',true),'Cancel request',()=>actionRequest(request,'cancel',{reason:document.querySelector('[name="cancelReason"]').value}),'danger');return}
      if(action==='approve'){const visitorFormIds=requireEcVisitors(),classification=requireClassification();modal('Approve selected visitors','<p class="small">Approve '+visitorFormIds.length+' selected visitor'+(visitorFormIds.length===1?'':'s')+'.</p>'+textareaField('approvalRemark','Remark'),'Approve selected',()=>actionRequest(request,'ec-approve',{visitorFormIds,comment:document.querySelector('[name="approvalRemark"]').value,idClassification:classification}),'success');return}
      if(action==='request-info'){
        const fields=Object.entries(REQUEST_FIELD_LABELS).map(item=>'<label class="check-row"><input type="checkbox" name="informationField" value="'+h(item[0])+'"> '+h(item[1])+'</label>').join('')
        modal('Request information',selectField('informationVisitor','Visitor','',[{value:'',label:'Select'},...request.visitors.map((visitor,index)=>({value:visitor.id,label:visitor.fullName==='Visitor details pending'?'Visitor '+(index+1):visitor.fullName}))],true)+'<div class="checkbox-grid">'+fields+'</div>'+textareaField('informationComment','Instructions','',true),'Send request',()=>actionRequest(request,'ec-request-documents',{visitorFormId:document.querySelector('[name="informationVisitor"]').value,fields:[...document.querySelectorAll('[name="informationField"]:checked')].map(item=>item.value),comment:document.querySelector('[name="informationComment"]').value}));return
      }
      if(action==='reject'){const visitorFormIds=requireEcVisitors(),classification=requireClassification();modal('Reject selected visitors',textareaField('rejectionReason','Rejection reason','',true),'Reject selected',()=>actionRequest(request,'ec-reject',{visitorFormIds,reason:document.querySelector('[name="rejectionReason"]').value,idClassification:classification}),'danger');return}
      if(action==='add-screening-remark'){button.disabled=true;await actionRequest(request,'ec-add-remark',{visitorFormId:document.querySelector('[name="screeningVisitor"]').value,remark:document.querySelector('[name="screeningRemark"]').value});return}
      const selection=requireReceptionSelection()
      const visitor=request.visitors.find(item=>item.id===selection.visitorFormId)
      if(action==='identity-approve'){const shownId=visitor.idType==='Other Government Issued ID'?visitor.otherIdType:visitor.idType;modal('Approve identity','<p class="small"><strong>'+h(visitor.fullName)+'</strong> · '+h(shownId)+'</p>','Approve identity',()=>actionRequest(request,'verify-identity',{...selection,decision:'APPROVE'}),'success');return}
      if(action==='identity-hold'){modal('Hold identity verification',textareaField('identityHoldReason','Hold reason','',true),'Place on hold',()=>actionRequest(request,'verify-identity',{...selection,decision:'HOLD',reason:document.querySelector('[name="identityHoldReason"]').value}),'warning');return}
      if(action==='assets-approve'){modal('Approve assets','<p class="small">Confirm that the declared assets match the visitor\'s belongings.</p>','Approve assets',()=>actionRequest(request,'verify-assets',{...selection,decision:'APPROVE'}),'success');return}
      if(action==='assets-hold'){modal('Hold asset verification',textareaField('assetsHoldReason','Hold reason','',true)+field('assetSerial','Asset serial number'),'Place on hold',()=>actionRequest(request,'verify-assets',{...selection,decision:'HOLD',reason:document.querySelector('[name="assetsHoldReason"]').value,assetSerial:document.querySelector('[name="assetSerial"]').value}),'warning');return}
      if(action==='no-show'){modal('Mark as no-show','<p class="small">'+h(visitor.fullName)+' will be recorded as a no-show for the selected date.</p>','Mark as no-show',()=>actionRequest(request,'no-show',selection));return}
    }catch(reason){button.disabled=false;toast(reason.message,'error')}
  })
}

function bindReceptionToggles(request){
  document.querySelectorAll('[data-reception-toggle]').forEach(checkbox=>checkbox.onchange=()=>{
    if(!checkbox.checked)return
    checkbox.checked=false
    try{
      const selection=requireReceptionSelection(),visitor=request.visitors.find(item=>item.id===selection.visitorFormId)
      if(checkbox.dataset.receptionToggle==='check-in'){
        const badge=document.querySelector('[name="receptionBadge"]')?.value.trim()||''
        if(!badge)throw new Error('Enter the badge ID before check-in.')
        modal('Check in visitor','<p class="small">Assign <strong>'+h(visitor.badgeType)+'</strong> badge <strong>'+h(badge)+'</strong> to '+h(visitor.fullName)+'.</p>','Check in',()=>actionRequest(request,'check-in',{...selection,badgeNumber:badge}),'success')
      }else{
        modal('Check out visitor','<p class="small">Confirm badge return and departure for '+h(visitor.fullName)+'.</p>','Check out',()=>actionRequest(request,'check-out',selection))
      }
    }catch(reason){toast(reason.message,'error')}
  })
}

  document.getElementById('reception-search').oninput=event=>{const query=event.currentTarget.value.toLowerCase();document.getElementById('reception-results').innerHTML=receptionTable(items.filter(item=>[item.batchId,item.visitorName,item.company,item.badge,item.requestNumber].some(value=>String(value||'').toLowerCase().includes(query))))}
}
function receptionTable(items){if(!items.length)return'<p class="empty">No visitors match this view.</p>';const link=item=>'/visitor-requests/'+h(item.requestId)+'?visitor='+encodeURIComponent(item.visitorFormId)+'&day='+encodeURIComponent(item.visitDayId);const desktop='<div class="table-wrap reception-desktop"><table class="data-table"><thead><tr><th scope="col">Batch ID</th><th scope="col">Request number</th><th scope="col">Visitor</th><th scope="col">Company</th><th scope="col">Host and escort</th><th scope="col">Person type</th><th scope="col">Visit date</th><th scope="col">ID and assets</th><th scope="col">Badge ID</th><th scope="col">Status</th><th scope="col"></th></tr></thead><tbody>'+items.map(item=>'<tr><td class="link">'+h(item.batchId)+'</td><td class="strong">'+h(item.requestNumber)+'</td><td class="strong">'+h(item.visitorName)+'</td><td>'+h(item.company)+'</td><td>'+h(item.mainHost+(item.escort?' / '+item.escort:''))+'</td><td>'+h(item.personType)+'</td><td>'+h(fmtDate(item.visitDate))+'</td><td>'+h(item.idType||'-')+' · '+h(item.assets?.length||0)+'</td><td><strong>'+h(item.badge||'-')+'</strong><br>'+badgeTypeTag(item.badgeType)+'</td><td>'+chip(item.status)+'</td><td><a href="'+link(item)+'" data-route class="primary-button compact-button">Manage</a></td></tr>').join('')+'</tbody></table></div>';const mobile='<div class="mobile-reception">'+items.map(item=>'<article class="mobile-reception-card"><div class="panel-heading"><div><strong>'+h(item.visitorName)+'</strong><p class="tiny muted">'+h(item.company)+'</p></div>'+chip(item.status)+'</div><dl><div><dt>Visit date</dt><dd>'+h(fmtDate(item.visitDate))+'</dd></div><div><dt>Person type</dt><dd>'+h(item.personType)+'</dd></div><div><dt>Host</dt><dd>'+h(item.mainHost)+'</dd></div><div><dt>Badge ID</dt><dd>'+h(item.badge||'-')+'<br>'+badgeTypeTag(item.badgeType)+'</dd></div></dl><a href="'+link(item)+'" data-route class="primary-button wide" style="display:block;text-align:center;margin-top:14px">Manage visitor</a></article>').join('')+'</div>';return desktop+mobile}

async function analyticsPage(main,title='Workflow analytics'){
  const data=await api('/api/analytics')
  const status=new URLSearchParams(location.search).get('status')||'',rows=status?data.rows.filter(row=>row.status===status):data.rows
  const statusCards=Object.entries(data.byStatus).slice(0,7).map(item=>[label(item[0]),item[1],'/reports?status='+encodeURIComponent(item[0])])
  const analyticsTable='<div class="table-wrap desktop-only"><table class="data-table"><thead><tr><th scope="col">Request number</th><th scope="col">Visitor</th><th scope="col">Company</th><th scope="col">Person type</th><th scope="col">Visit date</th><th scope="col">Request status</th><th scope="col">Screening</th><th scope="col">Badge ID</th></tr></thead><tbody>'+rows.map(row=>'<tr><td class="strong">'+h(row.requestNumber)+'</td><td>'+h(row.visitor||'Visitor details pending')+'</td><td>'+h(row.company)+'</td><td>'+h(row.personType)+'</td><td>'+h(fmtDate(row.visitDate))+'</td><td>'+chip(row.status)+'</td><td>'+chip(row.screeningDecision||'PENDING')+'</td><td>'+h(row.badgeId||'-')+'<br><span class="tiny muted">'+h(row.badgeType)+'</span></td></tr>').join('')+'</tbody></table></div><div class="mobile-records">'+rows.map(row=>'<article class="mobile-record"><div class="panel-heading"><strong>'+h(row.visitor||'Visitor details pending')+'</strong>'+chip(row.screeningDecision||'PENDING')+'</div><dl><div><dt>Request number</dt><dd>'+h(row.requestNumber)+'</dd></div><div><dt>Person type</dt><dd>'+h(row.personType)+'</dd></div><div><dt>Visit date</dt><dd>'+h(fmtDate(row.visitDate))+'</dd></div><div><dt>Badge ID</dt><dd>'+h(row.badgeId||'-')+'<br><span class="tiny muted">'+h(row.badgeType)+'</span></dd></div></dl></article>').join('')+'</div>'
  main.innerHTML=pageHeader('Export Control',title,'','<div class="button-row"><button class="secondary-button" data-export="csv">Export CSV</button><button class="primary-button" data-export="xlsx">Export XLSX</button></div>')+summaryCards([['Total requests',data.totalRequests,'/reports'],...statusCards])+(status?'<div class="status-banner"><span>'+h(rows.length)+' matching report row'+(rows.length===1?'':'s')+'</span><a href="/reports" data-route class="link">Clear filter</a></div>':'')+'<section class="panel">'+analyticsTable+'</section>'
  document.querySelectorAll('[data-export]').forEach(button=>button.onclick=()=>downloadExport(button.dataset.export))
}
async function downloadExport(format){try{const response=await fetch('/api/analytics/export.'+format,{headers:{'X-Visitor-Role':user.id}});if(!response.ok)throw new Error('Export could not be generated.');const blob=await response.blob();const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download='visitor-analytics.'+format;anchor.click();URL.revokeObjectURL(url)}catch(reason){toast(reason.message,'error')}}
async function render(){
  closeModal();const path=location.pathname
  const token=++viewToken
  if(!user){if(path!=='/login')sessionStorage.setItem('visitor.destination',path+location.search);renderLogin();return}
  if(path==='/login'){go('/dashboard');return}
  shell();const main=document.getElementById('page')
  try{
    if(path.startsWith('/visitor-forms/')){if(user.role!=='HOST_REQUESTER')throw new Error('Only the requester can edit visitor information.');await visitorFormPage(main)}
    else if(path==='/'||path==='/dashboard')await dashboardPage(main)
    else if(path==='/visitor-requests')await requestsPage(main)
    else if(path==='/my-visitors')await requestsPage(main,'mine')
    else if(path==='/visitor-history')await requestsPage(main,'history')
    else if(path==='/visitor-requests/new')await createRequestPage(main)
    else if(/^\/visitor-requests\/[^/]+$/.test(path))await detailPage(main,path.split('/').pop())
    else if(path==='/pending-actions')await pendingPage(main)
    else if(path==='/reception'||path==='/todays-visits')await receptionPage(main)
    else if(path==='/export-control')await analyticsPage(main)
    else if(path==='/reports')await analyticsPage(main,'Reports')
    else main.innerHTML=pageHeader('Workspace','Page not found')+'<a href="/dashboard" data-route class="primary-button">Return to dashboard</a>'
  }catch(reason){if(token===viewToken)main.innerHTML=pageHeader('Visitor Management','Unable to load this page')+errorBox(reason.message)}
}

document.addEventListener('click',event=>{const link=event.target.closest('a[data-route]');if(link){event.preventDefault();go(link.getAttribute('href'))}const refresh=event.target.closest('[data-render]');if(refresh)render()})
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal()})
window.addEventListener('popstate',render)
render()
</script>
